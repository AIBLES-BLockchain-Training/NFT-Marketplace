name: Deploy Indexer to GCP Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'packages/indexer/**'
      - '.github/workflows/deploy-indexer-gcp.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: nft-indexer
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/nft-indexer

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -f packages/indexer/Dockerfile -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: Push Docker image to GCR
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image=$IMAGE_NAME:${{ github.sha }} \
            --platform=managed \
            --region=$REGION \
            --allow-unauthenticated \
            --port=4001 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=10 \
            --add-cloudsql-instances=${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --set-env-vars="DB_HOST=${{ secrets.DB_HOST }},\
DB_PORT=${{ secrets.DB_PORT }},\
DB_NAME=${{ secrets.DB_NAME }},\
DB_USER=${{ secrets.DB_USER }},\
DB_PASS=${{ secrets.DB_PASS }},\
GQL_PORT=4001,\
RPC_SEPOLIA_HTTP=${{ secrets.RPC_SEPOLIA_HTTP }},\
PROCESSING_MODE=parallel,\
PERMISSIONS_CONTRACT=${{ secrets.PERMISSIONS_CONTRACT }},\
ROUTER_CONTRACT=${{ secrets.ROUTER_CONTRACT }},\
LISTING_CONTRACT=${{ secrets.LISTING_CONTRACT }},\
ADDRESS_PERMISSIONS=${{ secrets.ADDRESS_PERMISSIONS }},\
ADDRESS_EXTENSION_MANAGER=${{ secrets.ADDRESS_EXTENSION_MANAGER }},\
ADDRESS_AUCTION=${{ secrets.ADDRESS_AUCTION }},\
ADDRESS_OFFER=${{ secrets.ADDRESS_OFFER }},\
MORALIS_API_KEY=${{ secrets.MORALIS_API_KEY }},\
RARIBLE_API_KEY=${{ secrets.RARIBLE_API_KEY }},\
RARIBLE_CHAIN_ID=SEPOLIA"

      - name: Show deployment URL
        run: |
          echo "Service deployed to:"
          gcloud run services describe $SERVICE_NAME --region=$REGION --format='value(status.url)'
